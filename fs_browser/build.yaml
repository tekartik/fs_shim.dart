# See https://github.com/dart-lang/build/tree/master/build_web_compilers#configuration
# Matches previous configuration in pubspec.yaml - transformers - $dart2js
targets:
  $default:
    builders:
      build_web_compilers|entrypoint:
        # These are globs for the entrypoints you want to compile.
        generate_for:
          - example/**.dart
          - test/web/**.dart
          - test/multiplatform/**.dart
        options:
          # fs_shim transitively imports dart:io (throws at use on the web),
          # which dart2js accepts but the platform check would reject.
          unsafe-allow-unsupported-modules: true
