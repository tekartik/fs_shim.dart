name: tekartik_fs_io
description: Fs for dart io
version: 0.4.1
publish_to: none
#homepage: https://www.example.com
#author: alex <email@example.com>

environment:
  sdk: ^3.12.0

dependencies:
  path: ">=1.9.1"
  fs_shim: ">=2.3.3+1"
  idb_shim:

dev_dependencies:
  sqlite3: ">=2.9.4"
  lints: ">=6.1.0"
  test: ">=1.31.0"
  dev_build: ">=1.1.7+3"
  build_runner: ">=2.15.0"
  idb_sqflite:
  sqflite_common_ffi: ">=2.3.7"
  tekartik_fs_test:
    git:
      url: https://github.com/tekartik/fs_shim.dart
      path: fs_test
    version: '>=0.1.0'
  build_test: '>=0.10.2'
  process_run: ">=1.2.1+1"
  tekartik_platform_io:
    git:
      url: https://github.com/tekartik/platform.dart
      path: platform_io
    version: '>=0.2.0'

dependency_overrides:
  fs_shim:
    path: ../fs
  tekartik_fs_test:
    path: ../fs_test

